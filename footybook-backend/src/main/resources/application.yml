spring:
  application:
    name: footybook-backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/footybook_db}
    username: ${DB_USERNAME:footybook_user}
    password: ${DB_PASSWORD:footybook_pass}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: update  # Sử dụng: create-drop, create, update, validate, none
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        use_sql_comments: true  # Thêm comments vào SQL để dễ debug
        highlight_sql: true  # Highlight SQL syntax (nếu terminal hỗ trợ)
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true
        # Hiển thị thống kê performance
        generate_statistics: false  # Set true nếu muốn xem stats
    # Tắt open-in-view để tránh lazy loading issues
    open-in-view: false

  # Data JPA
  data:
    jpa:
      repositories:
        enabled: true

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: always
    include-binding-errors: always
    include-stacktrace: on_param  # Hiển thị stacktrace khi có ?trace=true

# JWT Configuration
jwt:
  secret: ${JWT_SECRET_KEY}
  expiration: ${JWT_EXPIRATION:86400000}  # 24 hours
  refresh-expiration: ${JWT_REFRESH_EXPIRATION:604800000}  # 7 days

# Logging Configuration
logging:
  level:
    root: INFO
    com.footybook.backend: DEBUG

    org.hibernate.SQL: DEBUG
    org.hibernate.tool.schema: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE

    org.springframework.orm.jpa: DEBUG
    com.zaxxer.hikari: DEBUG

  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"